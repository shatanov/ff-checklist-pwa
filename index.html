<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ФФ Проверка</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1c2530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ФФ Проверка">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;color:#171717}body{padding-bottom:90px}body.viewer-open{overflow:hidden}header{position:sticky;top:0;z-index:10;background:#1c2530;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px}header h1{font-size:16px;margin:0 0 5px}header p{margin:0;color:#ccd3db;font-size:12px}.bar{height:5px;background:#ffffff28;border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#54c98a}main{max-width:760px;margin:auto;padding:12px}.notice{background:#eaf4f2;border:1px solid #b8d9d3;border-radius:12px;padding:11px;margin-bottom:12px;font-size:13px}.card,.section{background:#fff;border:1px solid #deded9;border-radius:14px;margin-bottom:12px;overflow:hidden}.card{padding:14px}.section h2{font-size:16px;margin:0;padding:14px;background:#fafafa;border-bottom:1px solid #e7e7e2}.section h2 small{font-weight:400;color:#737373}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}}.field span,.lbl{display:block;font-size:12px;color:#666;font-weight:600;margin-bottom:5px}input[type=text],input[type=datetime-local],textarea{width:100%;font:inherit;font-size:16px;border:1px solid #cfcfca;border-radius:10px;padding:10px;background:#fff;color:#171717}textarea{min-height:74px;margin-top:10px;resize:vertical}.item{padding:15px 14px;border-bottom:1px dashed #ddd}.item:last-child{border-bottom:0}.question{font-size:15px;line-height:1.5;margin-bottom:12px}.inline-blank{display:inline-block!important;width:110px!important;min-width:80px!important;padding:3px 7px!important;margin:0 3px!important;border:0!important;border-bottom:2px solid #777!important;border-radius:0!important;background:#fafafa!important;font-size:15px!important;text-align:center;vertical-align:baseline}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.pill{position:relative;display:block}.pill input{position:absolute;opacity:0;pointer-events:none}.pill span{display:block;padding:10px 12px;min-width:70px;text-align:center;border:1px solid #cfcfca;border-radius:10px;background:#fff;font-size:14px;font-weight:600}.pill input:checked+span{background:#1c2530;color:#fff;border-color:#1c2530}.photo-actions{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}.photo-action{flex:1 1 140px;min-height:46px;border:1px dashed #aaa;border-radius:10px;padding:11px;text-align:center;font-weight:700;color:#0f5f57;background:#fafafa;cursor:pointer}.photo-action input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}.previews{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.ph{position:relative}.ph img{width:118px;height:118px;object-fit:cover;border-radius:10px;border:1px solid #d5d5d0;display:block;cursor:zoom-in;background:#f3f3f1}.ph button{position:absolute;right:-5px;top:-5px;width:26px;height:26px;border-radius:50%;border:0;background:#222;color:#fff;font-size:18px;line-height:24px;z-index:2}.print-gallery{display:none}.actions{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:#fffffff5;border-top:1px solid #ddd;display:flex;gap:8px;z-index:20}.actions button{flex:1;min-height:48px;border-radius:11px;border:1px solid #bbb;background:#fff;font:inherit;font-weight:700}.actions .primary{background:#0f5f57;color:#fff;border-color:#0f5f57}.viewer{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;touch-action:pan-y}.viewer.open{display:flex}.viewer-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:64px 12px 58px}.viewer img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-select:none}.viewer-close{position:absolute;right:calc(env(safe-area-inset-right) + 14px);top:calc(env(safe-area-inset-top) + 12px);z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:30px;line-height:40px}.viewer-count{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);color:#fff;background:rgba(0,0,0,.38);padding:5px 10px;border-radius:99px;font-size:13px}@media(max-width:430px){.ph img{width:104px;height:104px}.inline-blank{width:92px!important}}
@media print{
@page{size:A4;margin:12mm 11mm 14mm}
header,.actions,.notice,.photo-actions,.viewer,.ph button{display:none!important}body{padding:0;background:#fff;font-size:10.5pt}main{max-width:none;padding:0}.card,.section{border:0;border-radius:0;margin:0 0 5mm;overflow:visible}.section h2{padding:2.5mm 0 2mm;background:none;border-bottom:1px solid #777;font-size:12pt}.item{padding:3mm 0;border-bottom:1px solid #ddd;break-inside:auto}.question{font-size:10.5pt;margin-bottom:2mm}.inline-blank{width:25mm!important;padding:0 1mm!important;background:#fff!important;font-size:10.5pt!important;border-bottom:1px solid #555!important}.pills{margin-bottom:2mm;gap:2mm}.pill span{padding:1.5mm 2.5mm;min-width:0;font-size:9pt}.previews{display:none!important}.print-gallery{display:block!important;margin-top:3mm}.print-row{display:flex!important;gap:5mm;width:100%;margin:0 0 5mm;align-items:flex-start;break-inside:avoid-page!important;page-break-inside:avoid!important}.print-photo{flex:0 0 calc(50% - 2.5mm);min-width:0;display:flex;align-items:flex-start;justify-content:center;break-inside:avoid-page!important;page-break-inside:avoid!important}.print-photo img{display:block;width:100%;height:auto;max-height:100mm;object-fit:contain;border:1px solid #aaa;border-radius:2mm;background:#fff}.grid{gap:2mm 5mm}.field span,.lbl{font-size:8.5pt}input[type=text],input[type=datetime-local],textarea{border:1px solid #bbb;font-size:9.5pt;padding:2mm;min-height:0}textarea{height:auto}.card h2{font-size:12pt}}
</style>
</head>
<body>
<header><h1>Чек-лист офлайн-проверки ФФ</h1><p><span id="prog">0 / 49</span> · данные хранятся на этом устройстве</p><div class="bar"><i id="fill"></i></div></header>
<main><div class="notice" id="status">Подготовка офлайн-режима…</div><section class="card"><h2>Объект и проверка</h2><div class="grid" id="meta"></div></section><div id="app"></div><section class="card"><h2>Итог осмотра</h2><div class="lbl" style="margin-top:12px">Итоговая оценка</div><div class="pills" id="verdict"></div><div class="lbl">Критичные замечания</div><textarea data-save="summary.critical"></textarea><div class="lbl">Что необходимо устранить / уточнить</div><textarea data-save="summary.fix"></textarea><div class="lbl">Следующий шаг и ответственный</div><textarea data-save="summary.next"></textarea></section></main>
<div class="actions"><button class="primary" id="print" type="button">Сохранить PDF</button><button id="export" type="button">Очистить всё</button></div>
<div class="viewer" id="viewer" aria-hidden="true"><button class="viewer-close" id="viewerClose" type="button" aria-label="Закрыть">×</button><div class="viewer-stage" id="viewerStage"><img id="viewerImg" alt="Фото"></div><div class="viewer-count" id="viewerCount"></div></div>
<script src="./data.js"></script><script src="./app.js"></script>
</body>
</html>
