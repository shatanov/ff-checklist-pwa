<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ФФ Проверка</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1c2530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ФФ Проверка">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;color:#171717}body{padding-bottom:90px}header{position:sticky;top:0;z-index:10;background:#1c2530;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px}header h1{font-size:16px;margin:0 0 5px}header p{margin:0;color:#ccd3db;font-size:12px}.bar{height:5px;background:#ffffff28;border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#54c98a}main{max-width:760px;margin:auto;padding:12px}.notice{background:#eaf4f2;border:1px solid #b8d9d3;border-radius:12px;padding:11px;margin-bottom:12px;font-size:13px}.card,.section{background:#fff;border:1px solid #deded9;border-radius:14px;margin-bottom:12px;overflow:hidden}.card{padding:14px}.section h2{font-size:16px;margin:0;padding:14px;background:#fafafa;border-bottom:1px solid #e7e7e2}.section h2 small{font-weight:400;color:#737373}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}}.field span,.lbl{display:block;font-size:12px;color:#666;font-weight:600;margin-bottom:5px}input[type=text],input[type=datetime-local],textarea{width:100%;font:inherit;font-size:16px;border:1px solid #cfcfca;border-radius:10px;padding:10px;background:#fff;color:#171717}textarea{min-height:74px;margin-top:10px;resize:vertical}.item{padding:15px 14px;border-bottom:1px dashed #ddd}.item:last-child{border-bottom:0}.question{font-size:15px;line-height:1.4;margin-bottom:12px}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.pill{position:relative;display:block}.pill input{position:absolute;opacity:0;pointer-events:none}.pill span{display:block;padding:10px 12px;min-width:70px;text-align:center;border:1px solid #cfcfca;border-radius:10px;background:#fff;font-size:14px;font-weight:600}.pill input:checked+span{background:#1c2530;color:#fff;border-color:#1c2530}.photo{display:block;margin-top:4px;border:1px dashed #aaa;border-radius:10px;padding:11px;text-align:center;font-weight:700;color:#0f5f57;background:#fafafa}.photo input{display:block;width:100%;margin-top:8px;font-size:14px}.previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ph{position:relative}.ph img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid #ddd}.ph button{position:absolute;right:-5px;top:-5px;width:24px;height:24px;border-radius:50%;border:0;background:#222;color:#fff;font-size:17px}.actions{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:#fffffff5;border-top:1px solid #ddd;display:flex;gap:8px;z-index:20}.actions button{flex:1;min-height:48px;border-radius:11px;border:1px solid #bbb;background:#fff;font:inherit;font-weight:700}.actions .primary{background:#0f5f57;color:#fff;border-color:#0f5f57}@media print{header,.actions,.notice,.photo{display:none}body{padding:0;background:#fff}main{max-width:none;padding:0}}
</style>
</head>
<body>
<header><h1>Чек-лист офлайн-проверки ФФ</h1><p><span id="prog">0 / 49</span> · данные хранятся на этом устройстве</p><div class="bar"><i id="fill"></i></div></header>
<main><div class="notice" id="status">Подготовка офлайн-режима…</div><section class="card"><h2>Объект и проверка</h2><div class="grid" id="meta"></div></section><div id="app"></div><section class="card"><h2>Итог осмотра</h2><div class="lbl" style="margin-top:12px">Итоговая оценка</div><div class="pills" id="verdict"></div><div class="lbl">Критичные замечания</div><textarea data-save="summary.critical"></textarea><div class="lbl">Что необходимо устранить / уточнить</div><textarea data-save="summary.fix"></textarea><div class="lbl">Следующий шаг и ответственный</div><textarea data-save="summary.next"></textarea></section></main>
<div class="actions"><button class="primary" id="print">Печать / PDF</button><button id="export">Сохранить JSON</button></div>
<script>
const META=[["org","Фулфилмент / юр. лицо"],["address","Адрес объекта"],["datetime","Дата и время осмотра"],["inspector","Проверяющий"],["contact","Контакт на объекте"],["phone","Телефон / e-mail"],["volume","Планируемый объём / товар"],["declaredArea","Заявленная площадь по анкете"]];
const SECTIONS=[["Площади склада",["Реальная общая площадь. Должна быть: ______ м² (согласно анкете)","Свободная площадь, готовящаяся под нас: ______ м² / паллето-мест"]],["Зонирование склада",["Есть зона склада, зона сборки заказов, зона приёмки и зона брака","Зоны чётко разделены","Зоны уже оборудованы или прямо сейчас готовятся","Есть проходы / пути перемещения паллет"]],["Видеонаблюдение",["Камеры на территории","Камеры в зонах у ворот","Камеры в зонах сборки","Ведётся запись или только онлайн (указать)"]],["Зона сборки",["Заснять видео стола сборки","Есть зона контроля качества по итогам сборки"]],["Интернет",["Какой интернет установлен: проводной / мобильный / иной; сделать фото","Что делают при сбоях связи?"]],["Чистота",["Чисто во всех зонах, без пятен","Сухо, нет мокрых следов"]],["Зона хранения",["Тип хранения: напольное / стеллажное","При напольном хранении короба стоят на паллетах","При стеллажном хранении стеллажи прочные"]],["Зона приёмки",["Сделать фото зоны приёмки","Разноуровневая разгрузка с авто или вровень?","Если разноуровневая — есть погрузчик","Как обычно разгружают: вручную коробами / паллеты рохлей / автопогрузчиком"]],["Оборудование",["Компьютеры для работы","Принтер для печати стикеров WB","Расходники: скотч, картон, стикеры, бумага","Весы","Рохля / погрузчик"]],["Сотрудники",["Визуальный пересчёт штата","Должности / функционал: кто чем занимается в ФФ","Сколько сотрудников работает в одну смену"]],["Утепление и условия",["Температурный режим летом и зимой","Крыша не протекает","Нет прямых солнечных лучей"]],["Подъездная зона",["Достаточно места для заезда авто на 15 паллет или фуры на 33 паллеты","Запросить фото территории зимой: проверка расчистки снега"]],["Логистика",["Собственные автомобили или использование ТК","При наличии собственного транспорта — сделать осмотр"]],["Охрана и доступ",["У территории есть ворота, они закрываются","Есть охранник либо сигнализация","Территория не является территорией общего пользования (складские блоки допустимы)","График работы склада и территории","Водители заезжают по пропускам"]],["Соседствующие территории",["Вблизи ФФ нет опасных объектов повышенного риска"]],["Товары других клиентов ФФ",["Изучить категории: нет горючих / сильно пахнущих кормов","На примере других товаров: аккуратность, соблюдение условий, нет вмятин и пятен"]],["Пожарная безопасность",["Наличие и состояние средств пожарной безопасности / комментарий"]],["Подъездная дорога",["Качество подъездной дороги для автомобилей"]],["Территория склада",["Качество покрытия / земли территории склада: нет ям, нет крупных луж и застоев воды"]]];
const KEY="ff_checklist_state_v4";let state={meta:{},items:{},summary:{}};try{state=JSON.parse(localStorage.getItem(KEY))||state}catch(e){};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){};progress()};
function get(p){return p.split('.').reduce((v,k)=>v&&v[k],state)}function set(p,val){let a=p.split('.'),v=state;for(let i=0;i<a.length-1;i++)v=v[a[i]]||(v[a[i]]={});v[a.at(-1)]=val;save()}
function bind(el,p){let v=get(p);if(el.type==='radio'){el.checked=v===el.value;el.onchange=()=>el.checked&&set(p,el.value)}else{if(typeof v==='string')el.value=v;el.oninput=()=>set(p,el.value)}}
META.forEach(([k,l])=>{let f=document.createElement('label');f.className='field';f.innerHTML=`<span>${l}</span><input type="${k==='datetime'?'datetime-local':'text'}">`;let i=f.querySelector('input');bind(i,'meta.'+k);meta.appendChild(f)});
const opts=(id,p,vals)=>{let d=document.createElement('div');d.className='pills';vals.forEach(([v,t])=>{let l=document.createElement('label');l.className='pill';l.innerHTML=`<input type="radio" name="${id}_${p}" value="${v}"><span>${t}</span>`;bind(l.firstChild,`items.${id}.${p}`);d.appendChild(l)});return d};
SECTIONS.forEach((s,si)=>{let sec=document.createElement('section');sec.className='section';sec.innerHTML=`<h2>${si+1}. ${s[0]} <small>${s[1].length} п.</small></h2>`;s[1].forEach((q,ii)=>{let id=`s${si}i${ii}`,it=document.createElement('div');it.className='item';it.innerHTML=`<div class="question"><b>${ii+1}.</b> ${q}</div><div class="lbl">Статус</div>`;it.appendChild(opts(id,'status',[["yes","Да"],["no","Нет"],["part","Частично"],["na","Н/П"]]));let l=document.createElement('div');l.className='lbl';l.textContent='Доказательство';it.appendChild(l);let ev=document.createElement('div');ev.className='pills';['Фото','Видео','Со слов'].forEach(v=>{let lb=document.createElement('label');lb.className='pill';lb.innerHTML=`<input type="checkbox" value="${v}"><span>${v}</span>`;let c=lb.firstChild,a=get(`items.${id}.evidence`)||[];c.checked=a.includes(v);c.onchange=()=>{let x=[...(get(`items.${id}.evidence`)||[])],n=x.indexOf(v);c.checked&&n<0&&x.push(v);!c.checked&&n>=0&&x.splice(n,1);set(`items.${id}.evidence`,x)};ev.appendChild(lb)});it.appendChild(ev);l=document.createElement('div');l.className='lbl';l.textContent='Риск';it.appendChild(l);it.appendChild(opts(id,'risk',[["low","Низкий"],["mid","Средний"],["high","Высокий"]]));let ta=document.createElement('textarea');ta.placeholder='Комментарий / факт / цифра…';bind(ta,`items.${id}.comment`);it.appendChild(ta);let ph=document.createElement('label');ph.className='photo';ph.innerHTML=`📷 Добавить фото<input type="file" accept="image/*" capture="environment" multiple>`;it.appendChild(ph);let prev=document.createElement('div');prev.className='previews';prev.id='p_'+id;it.appendChild(prev);ph.querySelector('input').onchange=e=>addPhotos(id,[...e.target.files]).then(()=>{e.target.value='';drawPhotos(id)});sec.appendChild(it);setTimeout(()=>drawPhotos(id),0)});app.appendChild(sec)});
let vd=document.getElementById('verdict');[["Подходит","Подходит"],["Условно подходит","Условно"],["Не подходит","Не подходит"]].forEach(([v,t])=>{let l=document.createElement('label');l.className='pill';l.innerHTML=`<input type="radio" name="verdict" value="${v}"><span>${t}</span>`;bind(l.firstChild,'summary.verdict');vd.appendChild(l)});document.querySelectorAll('[data-save]').forEach(el=>bind(el,el.dataset.save));
function progress(){let d=0,t=0;SECTIONS.forEach((s,si)=>s[1].forEach((_,ii)=>{t++;if(get(`items.s${si}i${ii}.status`))d++}));prog.textContent=`${d} / ${t}`;fill.style.width=(t?d/t*100:0)+'%'}progress();
let dbp=new Promise((ok,no)=>{let r=indexedDB.open('ff_photos_v1',1);r.onupgradeneeded=()=>{let db=r.result;if(!db.objectStoreNames.contains('photos')){let s=db.createObjectStore('photos',{keyPath:'id',autoIncrement:true});s.createIndex('item','item',{unique:false})}};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
function addPhotos(item,files){return dbp.then(db=>Promise.all(files.map(blob=>new Promise((ok,no)=>{let tx=db.transaction('photos','readwrite');tx.objectStore('photos').add({item,blob,ts:Date.now()});tx.oncomplete=ok;tx.onerror=()=>no(tx.error)}))))}
function listPhotos(item){return dbp.then(db=>new Promise((ok,no)=>{let r=db.transaction('photos').objectStore('photos').index('item').getAll(item);r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)}))}
function delPhoto(id){return dbp.then(db=>new Promise((ok,no)=>{let tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)}))}
function drawPhotos(item){let box=document.getElementById('p_'+item);if(!box)return;box.innerHTML='';listPhotos(item).then(xs=>xs.forEach(x=>{let w=document.createElement('div');w.className='ph';let im=document.createElement('img'),u=URL.createObjectURL(x.blob);im.src=u;im.onload=()=>URL.revokeObjectURL(u);let b=document.createElement('button');b.type='button';b.textContent='×';b.onclick=()=>delPhoto(x.id).then(()=>drawPhotos(item));w.append(im,b);box.appendChild(w)})).catch(()=>{})}
print.onclick=()=>window.print();export.onclick=()=>{let b=new Blob([JSON.stringify({version:4,exportedAt:new Date().toISOString(),state,note:'Фото хранятся локально в IndexedDB и не входят в JSON.'},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ff-checklist-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').then(()=>status.textContent='Офлайн-режим готов. После первого полного открытия приложение работает без интернета. Ответы хранятся локально, фото — в IndexedDB.').catch(()=>status.textContent='Не удалось включить офлайн-кэш. Обновите страницу при наличии интернета.')}else status.textContent='Service Worker не поддерживается этим браузером.';
</script>
</body></html>
