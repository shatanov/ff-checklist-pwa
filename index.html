<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ФФ Проверка</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><meta name="theme-color" content="#1c2530"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ФФ Проверка"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;color:#171717}body{padding-bottom:90px}header{position:sticky;top:0;z-index:10;background:#1c2530;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px}header h1{font-size:16px;margin:0 0 5px}header p{margin:0;color:#ccd3db;font-size:12px}.bar{height:5px;background:#ffffff28;border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#54c98a}main{max-width:760px;margin:auto;padding:12px}.notice{background:#eaf4f2;border:1px solid #b8d9d3;border-radius:12px;padding:11px;margin-bottom:12px;font-size:13px}.card,.section{background:#fff;border:1px solid #deded9;border-radius:14px;margin-bottom:12px;overflow:hidden}.card{padding:14px}.section h2{font-size:16px;margin:0;padding:14px;background:#fafafa;border-bottom:1px solid #e7e7e2}.section h2 small{font-weight:400;color:#737373}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}}.field span,.lbl{display:block;font-size:12px;color:#666;font-weight:600;margin-bottom:5px}input[type=text],input[type=datetime-local],textarea{width:100%;font:inherit;font-size:16px;border:1px solid #cfcfca;border-radius:10px;padding:10px;background:#fff;color:#171717}textarea{min-height:74px;margin-top:10px;resize:vertical}.item{padding:15px 14px;border-bottom:1px dashed #ddd}.item:last-child{border-bottom:0}.question{font-size:15px;line-height:1.4;margin-bottom:12px}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.pill{position:relative;display:block}.pill input{position:absolute;opacity:0;pointer-events:none}.pill span{display:block;padding:10px 12px;min-width:70px;text-align:center;border:1px solid #cfcfca;border-radius:10px;background:#fff;font-size:14px;font-weight:600}.pill input:checked+span{background:#1c2530;color:#fff;border-color:#1c2530}.photo{display:block;margin-top:4px;border:1px dashed #aaa;border-radius:10px;padding:11px;text-align:center;font-weight:700;color:#0f5f57;background:#fafafa}.photo input{display:block;width:100%;margin-top:8px;font-size:14px}.previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ph{position:relative}.ph img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid #ddd}.ph button{position:absolute;right:-5px;top:-5px;width:24px;height:24px;border-radius:50%;border:0;background:#222;color:#fff;font-size:17px}.actions{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:#fffffff5;border-top:1px solid #ddd;display:flex;gap:8px;z-index:20}.actions button{flex:1;min-height:48px;border-radius:11px;border:1px solid #bbb;background:#fff;font:inherit;font-weight:700}.actions .primary{background:#0f5f57;color:#fff;border-color:#0f5f57}@media print{header,.actions,.notice,.photo{display:none}body{padding:0;background:#fff}main{max-width:none;padding:0}}</style></head><body><header><h1>Чек-лист офлайн-проверки ФФ</h1><p><span id="prog">0 / 49</span> · данные хранятся на этом устройстве</p><div class="bar"><i id="fill"></i></div></header><main><div class="notice" id="status">Подготовка офлайн-режима…</div><section class="card"><h2>Объект и проверка</h2><div class="grid" id="meta"></div></section><div id="app"></div><section class="card"><h2>Итог осмотра</h2><div class="lbl" style="margin-top:12px">Итоговая оценка</div><div class="pills" id="verdict"></div><div class="lbl">Критичные замечания</div><textarea data-save="summary.critical"></textarea><div class="lbl">Что необходимо устранить / уточнить</div><textarea data-save="summary.fix"></textarea><div class="lbl">Следующий шаг и ответственный</div><textarea data-save="summary.next"></textarea></section></main><div class="actions"><button class="primary" id="print" type="button">Печать / PDF</button><button id="export" type="button">Сохранить JSON</button></div><script src="./data.js"></script><script src="./app.js"></script></body></html>
